; CardputerADV-BasicAV v1.0 — OPTIONAL PlatformIO. Target: M5 Cardputer ADV (StampS3). See docs/M5BURNER.md.
;
; After `pio run`: ./scripts/merge_for_m5burner.sh
; https://docs.m5stack.com/en/uiflow/m5burner/publish

[platformio]
; Sketch + MjpegClass / tjpgd live in project root (Arduino IDE layout).
src_dir = .

[env:m5cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200

lib_deps =
  m5stack/M5Cardputer@^1.2.0
  earlephilhower/ESP8266Audio@^2.0.0

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

board_upload.flash_size = 8MB
